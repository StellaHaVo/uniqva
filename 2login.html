<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form</title>
<link rel="stylesheet" href="2login.css">
</head>
<body>
<div class="formplace">
<form id="login"> 
  <fieldset> 
    <legend>Đăng nhập</legend>

    <label for="email">Email:</label>
    <input type="text" id="loginEmail" name="email" size="50" placeholder="Nhập email của bạn" required>

    <label for="password">Mật khẩu:</label>
    <input type="password" id="loginPassword" name="password" placeholder="Nhập mật khẩu của bạn" required>

    <button type="submit">Đăng nhập</button>
  </fieldset>
</form>
</div>
<script src="2login.js"></script>
</body>
</html>
