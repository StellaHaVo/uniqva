<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form</title>
<link rel="stylesheet" href="register_login.css">
</head>
<body>
<div class="formplace">
  <form id="login"> 
    <fieldset> 
      <legend>Đăng nhập</legend>
      <label for="loginEmail">Email:</label>
      <input type="text" id="loginEmail" name="email" size="50" placeholder="Nhập email của bạn" required>
      <label for="loginPassword">Mật khẩu:</label>
      <input type="password" id="loginPassword" name="password" placeholder="Nhập mật khẩu của bạn" required>
      <button type="submit">Đăng nhập</button>
      <div class="ok" style="font-style: italic;"> (*) Chưa có tài khoản? => </div>
    </fieldset>
  </form>
</div>
<script src="script.js"></script>
</body>
</html>
